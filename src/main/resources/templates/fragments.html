<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ═══════════════════ HEAD FRAGMENT ═══════════════════ -->

<head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Zaregistrujte se jako účastník výzkumu esportového výkonu." />
    <title th:text="${title}">EsportNabor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
</head>

<!-- ═══════════════════ NAVBAR FRAGMENT ═══════════════════ -->
<nav th:fragment="navbar" class="navbar">
    <div class="navbar-inner">
        <a href="/" class="navbar-brand">
            <span class="brand-icon">🎮</span>
            <span class="brand-text">EsportNabor</span>
        </a>
        <ul class="navbar-links">
            <li><a href="#about">O studii</a></li>
            <li><a href="#register">Registrace</a></li>
        </ul>
    </div>
</nav>

<!-- ═══════════════════ FOOTER FRAGMENT ═══════════════════ -->
<footer th:fragment="footer" class="site-footer">
    <div class="footer-inner">
        <p>&copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span> EsportNabor &mdash;
            Grantový výzkumný projekt</p>
        <p class="footer-sub">Údaje účastníků jsou zpracovávány v souladu s nařízením GDPR.</p>
    </div>
</footer>

</html>
